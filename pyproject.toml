[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Accounts-payable invoice extraction, 3-way match and exception routing on synthetic data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
invoice-extractor = "invoice_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_extractor = ["schema.sql", "tolerances.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
