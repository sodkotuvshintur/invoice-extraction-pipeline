name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[llm,dev]"
      - run: pytest -q
      # end to end on fresh synthetic data; exits non-zero if any bad invoice auto-passes
      - run: invoice-extractor demo
